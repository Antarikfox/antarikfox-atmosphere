name: Release assets
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/build.py
      - run: python3 scripts/validate.py
      - run: node --test tests/*.test.cjs
      - name: Attach standalone card files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/antarikfox-atmosphere.js downloads/antarikfox-atmosphere.js.txt --clobber
